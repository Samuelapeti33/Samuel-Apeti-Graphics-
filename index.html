
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel Apeti Graphics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:#08020f;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#10091c;border:1px solid #a020f0;border-radius:25px;padding:35px 25px;text-align:center;box-shadow:0 0 25px #8000ff55}
.logo{color:#bd65ff;font-size:19px;font-weight:bold;letter-spacing:1px;margin-bottom:30px}
h1{font-size:30px;margin-bottom:12px}
.sub{color:#aaa2b8;margin-bottom:30px}
input{display:block;width:100%;padding:17px;margin-bottom:18px;border:1px solid #393044;border-radius:13px;background:#20182b;color:white;font-size:16px;outline:none}
button{width:100%;padding:17px;background:linear-gradient(90deg,#a020f0,#c026ff);color:white;border:0;border-radius:13px;font-size:17px;font-weight:bold;cursor:pointer}
a{color:#bd65ff;text-decoration:none;font-weight:bold}
.links{margin-top:25px;line-height:2.5;color:#aaa2b8;font-size:14px}
#home{display:none}
#home h1{color:#bd65ff;line-height:1.4}
#home p{color:#ccc;margin:22px 0;line-height:1.8}
</style>
</head>
<body>
<div class="card" id="login">
<div class="logo">SAMUEL APETI GRAPHICS</div>
<h1>Welcome Back</h1>
<p class="sub">Login to your account</p>
<form id="loginForm">
<input type="email" placeholder="Email address" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div class="links">
<a href="#" onclick="alert('Password recovery will be added later.');return false">Forgot password?</a>
<p>Don't have an account? <a href="#" onclick="alert('Sign Up will be added later.');return false">Sign Up</a></p>
</div>
</div>
<div class="card" id="home">
<div class="logo">SAG ✦</div>
<h1>Welcome to<br>Samuel Apeti Graphics!</h1>
<p>Your creative journey starts here.<br>Discover creativity, explore designs, and bring your ideas to life.</p>
<button onclick="alert('Welcome to Samuel Apeti Graphics!')">Let's Get Started!</button>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('login').style.display='none';
document.getElementById('home').style.display='block';
window.scrollTo(0,0);
});
</script>
</body>
</html>
